<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Salvea · Keşfet</title>
<link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="panel.css"></head>
<body class="solo"><div class="shell" style="max-width:560px">
<header class="top"><div class="tile"><img src="logo.png" alt="Salvea"></div><div><b id="hi">Keşfet</b><span id="sc"></span></div></header>
<div class="feed" id="feed" tabindex="0" aria-label="Günün kartları"></div>
<div class="msg" id="msg" role="alert"></div>
</div>
<script src="ortak.js"></script>
<script type="module">
import { db } from "./firebase.js";
import { guard } from "./guard.js";
import { mountNav } from "./nav.js";
import { SORULAR } from "./veri.js";
import { BILGILER, IPUCLARI, CESARETLER } from "./akisveri.js";
import { getProfile, setAvatar } from "./profilveri.js";
import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const me = await guard(); mountNav(me, "akis");
const { $ } = S, student = me.role === "student";
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
$("sc").textContent = me.okul || "";
// Her gün ve her kullanıcı için aynı kalan, ertesi gün değişen sıra
const day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5);
let seed = [...me.uid].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, day);
const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const card = (cls, ...kids) => { const c = el("section", "fcard " + cls); c.append(...kids); return c; };
const tag = t => el("small", "ftag", t);
const cta = (txt, href) => { const a = el("a", "btn sm fcta", txt); a.href = href; a.style.textDecoration = "none"; return a; };

let myProf = null, people = [], goal = null;
if (student) {
  try { myProf = (await getProfile(me.uid)); if (myProf.empty || myProf.denied) myProf = null; } catch (_) {}
  try { people = (await getDocs(query(collection(db, "profiller"), where("okulId", "==", me.okulId), where("herkeseAcik", "==", true)))).docs.map(d => ({ uid: d.id, ...d.data() })).filter(p => p.uid !== me.uid); } catch (_) {}
}
if (me.okulId) try { const d = (await getDocs(query(collection(db, "donemler"), where("okulId", "==", me.okulId)))).docs.map(x => x.data()).find(x => x.aktif); if (d && d.hedefPuan) goal = d; } catch (_) {}

const intro = () => { const g = new Date().getHours(), c = card("c-intro", tag(new Date().toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" })), el("h2", "", (g < 12 ? "Günaydın" : g < 18 ? "Merhaba" : "İyi akşamlar") + ", " + (me.takmaAd || me.ad)), el("p", "", "Bugünün kısa kartları hazır. Kaydırarak göz at: sorular, bilgiler, tanışacağın insanlar."), el("span", "fhint", "↓ Aşağı kaydır")); return c; };
const soru = () => card("c-soru", tag("Günün sorusu"), el("p", "fbig", SORULAR[day % SORULAR.length]), el("p", "", "Kendi cevabını düşün, sonra takım arkadaşlarına sor."), cta("Takım sohbetine git", "sohbet.html"));
const bilgi = t => card("c-bilgi", tag("Biliyor muydun?"), el("p", "fbig", t));
const ipucu = ([b, t]) => card("c-ipucu", tag("Kısa not"), el("h2", "", b), el("p", "", t));
const cesaret = t => card("c-cesaret", tag("Bugünün mini cesareti"), el("p", "fbig", t), el("p", "", "Küçük bir adım. Kimseye söylemek zorunda değilsin."));
const nefes = () => {
  const o = el("div", "breath"), tx = el("span", "", "Nefes al"), c = card("c-nefes", tag("1 dakikalık mola"), o, el("p", "", "4 saniye al, 4 saniye tut, 4 saniye ver."));
  o.append(tx); const w = ["Nefes al", "Tut", "Nefes ver"]; let i = 0; const t = setInterval(() => { if (!c.isConnected) return clearInterval(t); i = (i + 1) % 3; tx.textContent = w[i]; }, 4000); return c;
};
const hedef = () => { const p = Math.min(100, Math.round((goal.toplamPuan || 0) / goal.hedefPuan * 100)), b = el("div", "pbar"), i = el("i"); i.style.width = p + "%"; b.append(i); return card("c-hedef", tag("Okulun ortak hedefi"), el("p", "fbig", "%" + p), b, el("p", "", "Tüm takımlar birlikte " + (goal.toplamPuan || 0) + " / " + goal.hedefPuan + " puana ulaştı. Yarışmıyoruz, birlikte ilerliyoruz."), cta("Görevlere git", "gorevler.html")); };
const tanis = p => {
  const mine = new Set((myProf && myProf.ilgiler) || []), ortak = (p.ilgiler || []).filter(x => mine.has(x)), av = el("div", "av"), ch = el("div", "chips");
  setAvatar(av, null, p.takmaAd); getProfile(p.uid).then(x => x.foto && setAvatar(av, x.foto, p.takmaAd));
  (p.ilgiler || []).slice(0, 5).forEach(x => { const i = el("i", ortak.includes(x) ? "on" : "", x); ch.append(i); });
  return card("c-tanis", tag(ortak.length ? "Ortak noktanız var" : "Tanış"), av, el("h2", "", p.takmaAd || "Öğrenci"), el("p", "hint", p.sinif ? p.sinif + ". sınıf" : ""),
    ortak.length ? el("p", "", "Seninle " + ortak.length + " ortak ilgisi var: " + ortak.join(", ") + ".") : el("p", "", (p.tanitim || "").slice(0, 120)), ch, cta("Profile bak", "profil.html?u=" + p.uid));
};
const davet = () => card("c-davet", tag("Sen de görün"), el("h2", "", "Profilini paylaş, tanışmalar başlasın"), el("p", "", "Profilin sadece okulundaki öğrencilere, istediğin bilgilerle görünür. İstediğin an kapatabilirsin."), cta("Profilini düzenle", "student.html"));
const bitis = () => card("c-bitis", tag("Bugünlük bu kadar"), el("h2", "", "Yarın yeni kartlar gelir"), el("p", "", "Şimdi bir görev yapabilir ya da bilgi kartlarıyla oynayabilirsin."), cta("Bilgi kartları", "kultur.html"));

// kartları karıştırarak dizer: tür çeşitliliği olsun
const bil = shuffle(BILGILER).slice(0, 4), ip = shuffle(IPUCLARI).slice(0, 3), ce = shuffle(CESARETLER).slice(0, 1);
const tn = shuffle(people.filter(p => (p.ilgiler || []).length)).sort((a, b) => ((b.ilgiler || []).filter(x => ((myProf && myProf.ilgiler) || []).includes(x)).length > 0) - ((a.ilgiler || []).filter(x => ((myProf && myProf.ilgiler) || []).includes(x)).length > 0)).slice(0, 4);
const cards = [intro(), soru()];
const mix = [() => bilgi(bil[0]), () => tn[0] && tanis(tn[0]), () => ipucu(ip[0]), () => bilgi(bil[1]), () => cesaret(ce[0]), () => tn[1] && tanis(tn[1]), () => nefes(), () => goal && hedef(), () => bilgi(bil[2]), () => tn[2] && tanis(tn[2]), () => ipucu(ip[1]), () => student && !(myProf && myProf.herkeseAcik) && davet(), () => tn[3] && tanis(tn[3]), () => bilgi(bil[3]), () => ipucu(ip[2])];
mix.forEach(f => { const c = f(); if (c) cards.push(c); }); cards.push(bitis());
$("feed").replaceChildren(...cards);
document.addEventListener("keydown", e => { if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; const f = $("feed"); if (e.key === "ArrowDown") { e.preventDefault(); f.scrollBy({ top: f.clientHeight, behavior: "smooth" }); } if (e.key === "ArrowUp") { e.preventDefault(); f.scrollBy({ top: -f.clientHeight, behavior: "smooth" }); } });
</script></body></html>
